<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guardaroba">
<meta name="theme-color" content="#F1F0F4">
<title>Guardaroba di Silvia</title>
<style>
  :root{--bg:#F1F0F4;--fg:#6C6878}
  @media (prefers-color-scheme:dark){:root{--bg:#141218;--fg:#A39FAE}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  #l{display:flex;height:100%;align-items:center;justify-content:center;text-align:center;padding:0 24px;box-sizing:border-box}
</style>
</head>
<body>
<div id="l">Apro il guardaroba…</div>
<script>
/* Questa pagina scarica l'app aggiornata da Google: non serve più ricaricarla su GitHub. */
(function () {
  var API = "https://script.google.com/macros/s/AKfycbwP0JLQOFgCF961hCdFln3x9RzYnS4Lnd45_FqdvcfzjnRmnHAwQXs-CYbowZi-ME2P/exec";
  var msg = document.getElementById("l");
  fetch(API, {
    method: "POST",
    body: JSON.stringify({ fn: "appHtml", args: [] }),
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    credentials: "omit",
    redirect: "follow"
  })
    .then(function (r) { return r.json(); })
    .then(function (r) {
      if (!r.ok || !r.data) throw new Error(r.error || "vuoto");
      document.open();
      document.write(r.data);
      document.close();
    })
    .catch(function () {
      msg.textContent = "Connessione non riuscita. Controlla internet e ricarica la pagina.";
    });
})();
</script>
</body>
</html>
